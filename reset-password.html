<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reset Password - House Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">House Manage</div>
    <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
    <a href="flats.html" class="nav-item">🏢 All Flats</a>
    <a href="tenants.html" class="nav-item">👥 Tenants</a>
    <a href="payments.html" class="nav-item">💵 Rent Collection</a>
    <a href="performance.html" class="nav-item">📈 Performance</a>
    <a href="reports.html" class="nav-item">📄 Reports</a>
    <a href="expenses.html" class="nav-item">💸 Expenses</a>
    <a href="reset-password.html" class="nav-item active">🔐 Reset Password</a>
    <a href="#" class="nav-item" onclick="logout()">🚪 Logout</a>
  </aside>

  <main class="main-content">
    <div class="container">
      <h1 class="page-title">Reset Password</h1>
      
      <div class="card" style="max-width: 500px; margin: 0 auto;">
        <form id="resetPasswordForm">
          <div class="input-group">
            <label>Old Password</label>
            <input type="password" id="oldPass" required placeholder="Enter current password">
          </div>
          
          <div class="input-group">
            <label>Registered Email</label>
            <input type="email" id="email" required placeholder="Enter your registered email">
          </div>

          <div class="input-group">
            <label>New Password</label>
            <input type="password" id="newPass" required placeholder="Enter new password (min 4 chars)">
          </div>

          <div class="input-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPass" required placeholder="Re-type new password">
          </div>

          <p id="errorMsg" style="color: var(--danger); font-size: 13px; margin-bottom: 10px; display: none;"></p>

          <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Update Password</button>
        </form>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="b-nav-item">📊 Home</a>
    <a href="reports.html" class="b-nav-item">📄 Reports</a>
    <a href="tenants.html" class="b-nav-item">👥 Tenants</a>
    <a href="payments.html" class="b-nav-item">💵 Payments</a>
    <a href="more.html" class="b-nav-item">☰ More</a>
  </nav>

  <script src="app.js"></script>
  <script>
    document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const oldPass = document.getElementById('oldPass').value;
      const email = document.getElementById('email').value;
      const newPass = document.getElementById('newPass').value;
      const confirmPass = document.getElementById('confirmPass').value;
      const btn = document.getElementById('submitBtn');
      const errMsg = document.getElementById('errorMsg');

      // ভ্যালিডেশন
      if (newPass !== confirmPass) {
        errMsg.textContent = "New passwords do not match!";
        errMsg.style.display = 'block';
        return;
      }
      if (newPass.length < 4) {
        errMsg.textContent = "Password must be at least 4 characters long.";
        errMsg.style.display = 'block';
        return;
      }

      btn.textContent = 'Updating...';
      btn.disabled = true;
      errMsg.style.display = 'none';

      // ব্যাকএন্ডে রিকোয়েস্ট পাঠানো
      const res = await apiCall('changePassword', { 
        username: session.username, // app.js থেকে সেশন ইউজারনেম নেওয়া হচ্ছে
        data: { oldPassword: oldPass, email: email, newPassword: newPass } 
      });

      btn.textContent = 'Update Password';
      btn.disabled = false;

      if (res) {
        alert('Password updated successfully! Please logout and login with your new password.');
        logout(); // পাসওয়ার্ড চেঞ্জ হলে অটো লগআউট
      } else {
        errMsg.textContent = "Invalid Old Password or Email. Please try again.";
        errMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
