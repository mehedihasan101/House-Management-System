<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - House Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <h1>House Manage</h1>
      <p>Sign in to your account</p>
      
      <form id="loginForm">
        <div class="input-group">
          <label>Username</label>
          <input type="text" id="username" required placeholder="Enter username">
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="Enter password">
        </div>
        <p id="loginError" style="color: var(--danger); font-size: 13px; margin-bottom: 10px; display: none;"></p>
        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Login</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');

      btn.textContent = 'Signing in...';
      btn.disabled = true;
      err.style.display = 'none';

      const data = await apiCall('login', { username: user, password: pass });
      
      if (data && data.token) {
        localStorage.setItem('hm_session', JSON.stringify(data));
        window.location.href = 'dashboard.html';
      } else {
        err.textContent = data ? data.message : 'Invalid credentials or server error';
        err.style.display = 'block';
        btn.textContent = 'Login';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
